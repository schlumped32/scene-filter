# Publishes a release of the version in app/VERSION.
# Start it from the Actions tab (Release > Run workflow), or by pushing a tag like v7.
# Builds the update package, latest.json and the Mac/Windows downloads with tools/build.py,
# then creates the GitHub release with them attached, using release-notes/v<N>.md as its text.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Work out the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < app/VERSION)"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match app/VERSION ($version)"; exit 1
          fi
          draft="$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$draft" = "true" ]; then
            # A leftover draft (never published, so no installed copy has seen it) would block the release:
            # remove it and publish a fresh one.
            echo "Removing the unpublished draft of version $version"
            gh release delete "v$version" --repo "$GITHUB_REPOSITORY" --yes
          elif [ "$draft" = "false" ]; then
            echo "Version $version is already released. Raise app/VERSION to publish a new one."; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build release files
        run: python tools/build.py --repo "$GITHUB_REPOSITORY"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="release-notes/v$VERSION.md"
          [ -f "$notes" ] || notes=/dev/null
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" \
            --title "Version $VERSION" --notes-file "$notes" --latest
